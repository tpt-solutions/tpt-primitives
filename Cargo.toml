[workspace]
resolver = "2"
members = ["crates/tpt-primitives", "crates/schema-gen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
homepage = "https://tpt.example"
repository = "https://tpt.example/tpt-primitives"
readme = "README.md"

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = "warn"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
