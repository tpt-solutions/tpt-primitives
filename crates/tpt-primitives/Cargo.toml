[package]
name = "tpt-primitives"
description = "Foundational shared primitives for the Fabric / Repro / Concord ecosystem"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["capability", "provenance", "assurance", "reproducibility", "canonical"]
categories = ["data-structures", "encoding"]

[dependencies]
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
sha2 = "0.11"
schemars = "1"

[dev-dependencies]
proptest = "1"
tpt-derive = { path = "../tpt-derive" }
serde_json = "1"

[lints]
workspace = true
