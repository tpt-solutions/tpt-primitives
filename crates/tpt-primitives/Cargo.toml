[package]
name = "tpt-primitives"
description = "Foundational shared primitives for the Fabric / Repro / Concord ecosystem"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["capability", "provenance", "assurance", "reproducibility", "canonical"]
categories = ["data-structures", "encoding"]

[features]
# `no_std` + `alloc` is the base. `std` adds the std-backed impls of the
# dependencies and the std::error::Error impls.
default = ["std"]
std = ["serde/std", "cbor4ii/use_std", "sha2/std", "schemars/std"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
# CBOR for the serde layer. `serde1` pulls in alloc and nothing else.
cbor4ii = { version = "1", default-features = false, features = ["serde1"] }
sha2 = { version = "0.10", default-features = false }
schemars = { version = "1", default-features = false, features = ["derive"] }

[dev-dependencies]
proptest = "1"
tpt-derive = { path = "../tpt-derive" }
serde_json = "1"

[lints]
workspace = true
